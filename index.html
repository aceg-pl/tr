<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>European Languages Translator</title>
<style>
:root{--base-font:10px}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:#eef;color:#111;text-align:center}
#controls{padding:8px}
#word{padding:8px 10px;font-size:13px;width:40%;max-width:300px;border-radius:6px;border:1px solid #bbb}
#go{padding:9px 12px;margin-left:8px;font-size:12px;border-radius:6px;border:0;background:#2b7cff;color:#fff;cursor:pointer}
#mapWrap{position:relative;width:95%;max-width:1100px;margin:12px auto}
#mapImg{display:block;width:100%;height:auto}
.pin{position:absolute;transform:translate(-50%,-50%);white-space:nowrap;display:flex;align-items:center;padding:3px 6px;border-radius:3px;background:rgba(255,255,255,.85);box-shadow:0 1px 2px rgba(0,0,0,.12);pointer-events:auto}
.pin img{width:18px;height:12px;margin-right:6px;display:inline-block}
.fam-geo{background:rgba(150,200,255,.9)} /* germanic/geo */
.fam-rom{background:rgba(170,255,170,.9)} /* romance */
.fam-sla{background:rgba(255,160,160,.95)} /* slavic */
.fam-ural{background:rgba(255,255,150,.9)} /* uralic/other */
.fam-bal{background:rgba(220,180,255,.9)} /* baltic */
/* Responsive pin text size controlled via JS scaling */
#legend{max-width:800px;margin:6px auto;font-size:12px}
#status{font-size:11px;color:#555;margin-top:5px}
</style>
</head>
<body>

<div id="controls">
<input id="word" placeholder="Enter a word to translate here" />
<button id="go">Go</button>
</div>

<div id="legend">
<strong>Language Families:</strong>
<span style="margin-left:8px;padding:3px 6px;border-radius:4px;background:rgba(150,200,255,.9)">Germanic</span>
<span style="margin-left:6px;padding:3px 6px;border-radius:4px;background:rgba(170,255,170,.9)">Romance</span>
<span style="margin-left:6px;padding:3px 6px;border-radius:4px;background:rgba(255,160,160,.95)">Slavic</span>
<span style="margin-left:6px;padding:3px 6px;border-radius:4px;background:rgba(220,180,255,.9)">Baltic</span>
<span style="margin-left:6px;padding:3px 6px;border-radius:4px;background:rgba(255,255,150,.9)">Other</span>
</div>

<div id="mapWrap">
<img id="mapImg" src="https://raw.githubusercontent.com/aceg-pl/tr/main/Europe.png" alt="Europe map">
</div>

<div id="status">Ready.</div>

<script>
/* -------- CONFIG ---------- */
/* native image size we calibrated to (px) */
const MAP_W = 1532, MAP_H = 1253;

/* countries list:
cc: two-letter used for flagcdn (lowercase)
code: display code (2 letters uppercase)
x,y: percent positions relative to the calibrated PNG (0..100)
l: translate target language code
fam: family css suffix
*/
const COUNTRIES = [
{cc:'pt',code:'PT',x:7,y:83,l:'pt',fam:'fam-rom'},
{cc:'es',code:'ES',x:16,y:85,l:'es',fam:'fam-rom'},
{cc:'fr',code:'FR',x:27,y:69,l:'fr',fam:'fam-rom'},
{cc:'be',code:'BE',x:30,y:62.5,l:'fr',fam:'fam-geo'},
{cc:'nl',code:'NL',x:32,y:57,l:'nl',fam:'fam-geo'},
{cc:'ie',code:'IE',x:15,y:51,l:'ga',fam:'fam-geo'},
{cc:'gb',code:'UK',x:22,y:55,l:'en',fam:'fam-geo'},
{cc:'dk',code:'DK',x:36.5,y:48,l:'da',fam:'fam-geo'},
{cc:'de',code:'DE',x:37.5,y:60,l:'de',fam:'fam-geo'},
{cc:'ch',code:'CH',x:35,y:71,l:'de',fam:'fam-rom'},
{cc:'at',code:'AT',x:42,y:69,l:'de',fam:'fam-geo'},
{cc:'se',code:'SE',x:42.5,y:32,l:'sv',fam:'fam-geo'},
{cc:'no',code:'NO',x:39.5,y:26,l:'no',fam:'fam-geo'},
{cc:'fi',code:'FI',x:54,y:27,l:'fi',fam:'fam-ural'},
{cc:'ee',code:'EE',x:55.5,y:40,l:'et',fam:'fam-ural'},
{cc:'lv',code:'LV',x:55,y:44,l:'lv',fam:'fam-bal'},
{cc:'lt',code:'LT',x:54,y:48.5,l:'lt',fam:'fam-bal'},
{cc:'by',code:'BY',x:60,y:52,l:'be',fam:'fam-sla'},
{cc:'ru',code:'RU',x:74,y:42,l:'ru',fam:'fam-sla'},
{cc:'ua',code:'UA',x:66,y:61,l:'uk',fam:'fam-sla'},
{cc:'pl',code:'PL',x:49.5,y:57,l:'pl',fam:'fam-sla'},
{cc:'de',code:'DE',x:48,y:54,l:'de',fam:'fam-geo'},
{cc:'cz',code:'CZ',x:44,y:63,l:'cs',fam:'fam-sla'},
{cc:'sk',code:'SK',x:52,y:66,l:'sk',fam:'fam-sla'},
{cc:'hu',code:'HU',x:51,y:69.5,l:'hu',fam:'fam-ural'},
{cc:'si',code:'SI',x:45,y:73,l:'sl',fam:'fam-sla'},
{cc:'hr',code:'HR',x:45,y:76,l:'hr',fam:'fam-sla'},
{cc:'ba',code:'BA',x:50,y:79,l:'bs',fam:'fam-sla'},
{cc:'rs',code:'RS',x:54,y:74.5,l:'sr',fam:'fam-sla'},
{cc:'al',code:'AL',x:54,y:84,l:'sq',fam:'fam-sla'},
{cc:'mk',code:'MK',x:55,y:81.5,l:'mk',fam:'fam-sla'},
{cc:'bg',code:'BG',x:61,y:78,l:'bg',fam:'fam-sla'},
{cc:'ro',code:'RO',x:59.5,y:70.5,l:'ro',fam:'fam-rom'},
{cc:'gr',code:'GR',x:56,y:88,l:'el',fam:'fam-rom'},
{cc:'tr',code:'TR',x:79,y:81,l:'tr',fam:'fam-ural'},
{cc:'mt',code:'MT',x:45,y:98,l:'mt',fam:'fam-rom'},
{cc:'it',code:'IT',x:39.5,y:79.5,l:'it',fam:'fam-rom'},
{cc:'ad',code:'AD',x:25,y:80,l:'ca',fam:'fam-rom'},
{cc:'is',code:'IS',x:13,y:21,l:'is',fam:'fam-geo'},
{cc:'fo',code:'FO',x:20,y:30,l:'fo',fam:'fam-geo'}
];

/* dedupe by code to avoid duplicates: keep first occurrence per code */
const dedup = [];
const seen = new Set();
for(const p of COUNTRIES){
if(!seen.has(p.code)){ dedup.push(p); seen.add(p.code); }
}
const PLACES = dedup;

/* helper: small flag url */
const flagURL = (cc)=>`https://flagcdn.com/24x18/${cc.toLowerCase()}.png`;

/* Google JSON translate (unofficial but works client-side) */
async function gt(word, tl){
try{
const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=${tl}&dt=t&q=${encodeURIComponent(word)}`;
const r = await fetch(url);
if(!r.ok) throw 0;
const j = await r.json();
return j && j[0] && j[0][0] && j[0][0][0] ? j[0][0][0] : word;
}catch(e){
return word;
}
}

/* place pins correctly relative to image size */
function placePin(mapWrap, imgRect, place, text){
const pin = document.createElement('div');
pin.className = 'pin '+place.fam;
// compute position in px from percent coords
const left = (place.x/100) * imgRect.width;
const top = (place.y/100) * imgRect.height;
pin.style.left = Math.round(left)+'px';
pin.style.top = Math.round(top)+'px';
// content: flag + CODE : text
pin.innerHTML = `<img src="${flagURL(place.cc)}" alt="${place.code}">` +
// `<strong style="margin-right:6px">${place.code}</strong>` +
`<span class="t">${text}</span>`;
mapWrap.appendChild(pin);
return pin;
}

/* scale pin fonts according to map width */
function scalePins(mapWrap){
const img = document.getElementById('mapImg');
const w = img.clientWidth;
const base = Math.max(10, Math.round(w/60)); // dynamic base font
document.documentElement.style.setProperty('--base-font', base+'px');
// apply to pins
const pins = mapWrap.querySelectorAll('.pin');
pins.forEach(p=>{
p.style.fontSize = (base)+'px';
const imgTag = p.querySelector('img');
if(imgTag) imgTag.style.width = Math.max(12, Math.round(base*1.2))+'px';
if(imgTag) imgTag.style.height = Math.max(8, Math.round(base*0.8))+'px';
});
}

/* main flow */
const mapWrap = document.getElementById('mapWrap');
const img = document.getElementById('mapImg');
const status = document.getElementById('status');

async function translateAll(word){
// clear pins
document.querySelectorAll('.pin').forEach(n=>n.remove());
status.textContent = 'Translating... (this may take a few seconds)';
// measure image size
const imgRect = img.getBoundingClientRect();
// create promises in batches to avoid hammering network
// We'll do parallel fetches but chunked to 50 at a time
const results = {};
const batchSize = 50;
for(let i=0;i<PLACES.length;i+=batchSize){
const batch = PLACES.slice(i,i+batchSize);
const prom = batch.map(p=>gt(word,p.l).then(t=>({p,t})));
const resolved = await Promise.all(prom);
resolved.forEach(({p,t})=>{
results[p.code]=t;
placePin(mapWrap, imgRect, p, t);
});
// update scaling for pins placed so far
scalePins(mapWrap);
}
status.textContent = 'Done. Translations shown.';
}

/* UI handlers */
document.getElementById('go').addEventListener('click',()=>{
const w = document.getElementById('word').value.trim();
if(!w) return;
translateAll(w);
});

/* reposition pins on resize/zoom */
let resizeTimer;
function repositionPins(){
const imgRect = img.getBoundingClientRect();
const pins = Array.from(document.querySelectorAll('.pin'));
pins.forEach(pin=>{
// extract code from strong element
const codeEl = pin.querySelector('strong');
const code = codeEl?codeEl.textContent.trim():'';
// find place by code
const place = PLACES.find(p=>p.code===code);
if(place){
const left = (place.x/100) * imgRect.width;
const top = (place.y/100) * imgRect.height;
pin.style.left = Math.round(left)+'px';
pin.style.top = Math.round(top)+'px';
}
});
scalePins(mapWrap);
}

window.addEventListener('resize',()=>{
clearTimeout(resizeTimer);
resizeTimer = setTimeout(repositionPins,120);
});

/* initial scaling after image loads */
img.addEventListener('load',()=>{
scalePins(mapWrap);
repositionPins();
});

</script>
</body>
</html>
